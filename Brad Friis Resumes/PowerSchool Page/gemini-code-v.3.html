<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operating Rhythm Prototype</title>
<style>
  :root {
    --bg-page: #fbfbfd;
    --bg-card: #ffffff;
    --text-main: #1d1d1f;
    --text-muted: #86868b;
    --border: #e5e5ea;
    --border-hover: #d2d2d7;
    --focus-ring: #0071e3;
    
    --cat-growth: #c05621;      
    --cat-delivery: #319795;    
    --cat-operations: #4a5568;  
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #000000;
      --bg-card: #1c1c1e;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --border: #38383a;
      --border-hover: #505053;
      --focus-ring: #2997ff;

      --cat-growth: #f6ad55;
      --cat-delivery: #4fd1c5;
      --cat-operations: #a0aec0;
    }
  }

  * { box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    line-height: 1.5;
    margin: 0;
    padding: 3rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .intro {
    max-width: 800px;
    margin-bottom: 2.5rem;
  }
  
  .intro h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem 0;
  }

  .intro p {
    font-size: 1.125rem;
    color: var(--text-muted);
    margin: 0 0 1.5rem 0;
  }
  
  .disclaimer {
    font-size: 0.875rem;
    color: var(--text-muted);
    border-left: 2px solid var(--border);
    padding-left: 1rem;
    line-height: 1.6;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
    position: sticky;
    top: 0;
    background: rgba(251, 251, 253, 0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 1rem 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }

  @media (prefers-color-scheme: dark) {
    .filters { background: rgba(0, 0, 0, 0.95); }
  }

  .filter-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.5rem 1.25rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  
  @media (prefers-reduced-motion) {
    .filter-btn { transition: none; }
  }

  .filter-btn[aria-pressed="true"] {
    background: var(--text-main);
    color: var(--bg-card);
    border-color: var(--text-main);
  }

  .filter-btn:hover:not([aria-pressed="true"]) {
    border-color: var(--border-hover);
    color: var(--text-main);
  }

  .filter-btn:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1.5rem;
  }

  .day-column h2 {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.75rem;
    margin-bottom: 1.25rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .slots {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .slot-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
    font-weight: 500;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.25rem;
    text-align: left;
    width: 100%;
    cursor: pointer;
    position: relative;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border-left-width: 3px;
  }

  @media (prefers-reduced-motion) {
    .card { transition: opacity 0.1s; }
  }

  .card.filtered-out {
    opacity: 0.15;
    pointer-events: none;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
    border-right-color: var(--border-hover);
    border-top-color: var(--border-hover);
    border-bottom-color: var(--border-hover);
  }

  .card:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  
  .card.is-related {
    box-shadow: 0 0 0 2px var(--border-hover);
    background-color: var(--bg-page);
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 0.5rem 0;
    line-height: 1.3;
    color: var(--text-main);
  }

  .card-summary {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.5;
  }

  .card-cat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.5rem;
    display: inline-block;
    font-weight: 600;
  }

  dialog {
    padding: 2.5rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-card);
    color: var(--text-main);
    max-width: 520px;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
  }

  dialog::backdrop {
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  .dialog-close {
    background: var(--bg-page);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 0.5rem 1.25rem;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 2rem;
    font-size: 0.875rem;
    font-weight: 500;
    transition: background 0.2s;
  }

  .dialog-close:hover {
    background: var(--border);
  }

  .detail-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .tag {
    font-size: 0.75rem;
    background: var(--bg-page);
    border: 1px solid var(--border);
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    color: var(--text-muted);
  }

  @media (max-width: 1024px) {
    .calendar-grid { grid-template-columns: 1fr; }
    .day-column { margin-bottom: 2.5rem; }
    .slots { flex-direction: row; flex-wrap: wrap; }
    .card { flex: 1 1 calc(50% - 1rem); }
  }

  @media (max-width: 768px) {
    body { padding: 2rem 1rem; }
    .slots { flex-direction: column; }
    .card { flex: 1 1 100%; }
    dialog {
      width: 100%;
      max-width: 100%;
      margin: 0;
      margin-top: auto;
      border-radius: 16px 16px 0 0;
      padding: 2rem 1.5rem;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="intro">
    <h1>Operating Rhythm</h1>
    <p>A demonstration of operational breadth across Growth, Delivery, and Operations.</p>
    <div class="disclaimer">
      This calendar is an illustrative composite of recurring responsibilities. It is not a literal record of a specific week and contains no confidential commercial figures or actual customer identities.
    </div>
  </div>

  <div class="filters" id="filterContainer" role="group" aria-label="Filter entries by category">
    <!-- Filter buttons injected here -->
  </div>
  
  <div aria-live="polite" class="sr-only" id="announceArea" style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;"></div>

  <div class="calendar-grid" id="calendarGrid">
    <!-- Grid injected here -->
  </div>
</div>

<dialog id="detailDialog">
  <div id="dialogContent"></div>
  <button class="dialog-close" id="closeDialogBtn">Close</button>
</dialog>

<script>
  const categories = {
    growth: { label: "Growth", color: "var(--cat-growth)" },
    delivery: { label: "Delivery", color: "var(--cat-delivery)" },
    operations: { label: "Operations", color: "var(--cat-operations)" }
  };

  const days = ["monday", "tuesday", "wednesday", "thursday", "friday"];

  const entryData = [
    {
      id: "database-segmentation",
      day: "monday",
      slot: "Morning",
      title: "NZ Schools Database Architecture",
      summary: "Segment prospective schools by roll count, region, and type.",
      detail: "I required a precise lead generation engine, not a generic mailing list. I built and maintained a comprehensive database of New Zealand school principals, segmenting the data tightly by school roll count, geographic region, and school type. This allowed us to tailor our commercial messaging to specific profiles, equipping the sales team with high-context leads and clear entry points.",
      primaryCategory: "growth",
      modes: ["lead generation", "data architecture", "sales strategy"],
      connections: ["sales-pipeline"]
    },
    {
      id: "gov-facilitation",
      day: "monday",
      slot: "Afternoon",
      title: "Government-Funded Facilitation",
      summary: "Deliver strategic guidance for a school leadership team.",
      detail: "I delivered professional learning and strategic guidance as an accredited government facilitator. I helped school leaders connect technology decisions with teaching and organisational priorities, ensuring adoption was driven by educational outcomes.",
      primaryCategory: "delivery",
      modes: ["facilitation", "advisory", "professional learning"],
      connections: []
    },
    {
      id: "conference-stand-concept",
      day: "tuesday",
      slot: "Morning",
      title: "Conference Stand Concept & Design",
      summary: "Design the physical layout and structural presence for our upcoming event.",
      detail: "A successful physical presence requires more than branding. I designed the initial concept and layout for our national conference stand, mapping how foot traffic would flow into demonstrations and conversations. This ensured the physical space actively supported our lead generation hooks.",
      primaryCategory: "growth",
      modes: ["concept design", "event strategy", "vendor management"],
      connections: ["conference-logistics", "conference-outreach"]
    },
    {
      id: "sla-review",
      day: "tuesday",
      slot: "Afternoon",
      title: "SLA & Billing Strategy Review",
      summary: "Standardise reporting metrics and financial tracking.",
      detail: "Operational health requires clear boundaries and predictable systems. I ran a comprehensive review of our service level agreements, ensuring our support delivery aligned with our billing structures. This equipped our internal teams with a transparent view of performance and capacity.",
      primaryCategory: "operations",
      modes: ["financial strategy", "process design", "governance"],
      connections: []
    },
    {
      id: "conference-comms",
      day: "wednesday",
      slot: "Morning",
      title: "Conference Communications Strategy",
      summary: "Draft the messaging framework for pre- and post-event engagement.",
      detail: "I drafted the overarching communications strategy for our conference sponsorship. This involved coordinating email sequences, social updates, and direct invitations to ensure our messaging was unified across the sales and marketing functions.",
      primaryCategory: "growth",
      modes: ["communications design", "marketing strategy", "writing"],
      connections: ["conference-outreach"]
    },
    {
      id: "conference-workshop-design",
      day: "wednesday",
      slot: "Afternoon",
      title: "Conference Workshop Design",
      summary: "Write and structure the core presentation and materials.",
      detail: "Rather than delivering a standard product pitch, I structured our workshop content to solve immediate educational challenges while embedding targeted lead generation hooks. I wrote the core presentation and designed the supporting materials for the session.",
      primaryCategory: "delivery",
      modes: ["content design", "instructional design", "production"],
      connections: ["conference-workshop-presentation"]
    },
    {
      id: "conference-outreach",
      day: "thursday",
      slot: "Morning",
      title: "Targeted Pre-Event Outreach",
      summary: "Drive priority accounts and targeted segments to visit the stand.",
      detail: "Using our segmented schools database, I managed targeted outreach campaigns directing specific school leaders to our conference stand. This ensured we had guaranteed meetings scheduled alongside organic foot traffic.",
      primaryCategory: "growth",
      modes: ["lead generation", "sales execution", "campaign management"],
      connections: ["database-segmentation", "conference-stand-concept"]
    },
    {
      id: "conference-logistics",
      day: "thursday",
      slot: "Morning",
      title: "Conference Logistics & Build Setup",
      summary: "Manage the end-to-end operational execution of the event presence.",
      detail: "Physical events require strict logistical control to ensure a return on investment. I managed the operational execution of our national stand build and physical setup. By standardising vendor timelines, I equipped the on-site team with a frictionless environment, allowing them to focus entirely on customer interactions.",
      primaryCategory: "operations",
      modes: ["logistics", "vendor management", "coordination"],
      connections: ["conference-stand-concept"]
    },
    {
      id: "conference-workshop-presentation",
      day: "thursday",
      slot: "Afternoon",
      title: "Conference Workshop Presentation",
      summary: "Deliver the core workshop session to school leaders.",
      detail: "A successful conference requires bridging the gap between high-level strategy and on-the-ground value. I presented our core workshop to attendees, equipping them with actionable insights while simultaneously qualifying them for our sales pipeline.",
      primaryCategory: "delivery",
      modes: ["public speaking", "facilitation", "sales enablement"],
      connections: ["conference-workshop-design", "conference-follow-up"]
    },
    {
      id: "reseller-sync",
      day: "friday",
      slot: "Morning",
      title: "International Reseller Sync",
      summary: "Coordinate operational priorities with our international platform partner.",
      detail: "I coordinated strategic priorities with our international platform partner. I reviewed shared commitments across technical implementation, ongoing support, and regional compliance to maintain alignment.",
      primaryCategory: "operations",
      modes: ["partnership management", "negotiation", "coordination"],
      connections: []
    },
    {
      id: "conference-follow-up",
      day: "friday",
      slot: "Morning",
      title: "Post-Conference Lead Follow-Up Workflows",
      summary: "Process conference interactions into actionable pipeline.",
      detail: "After the event, I managed the follow-up systems to convert stand interactions and workshop attendance into active pipeline. I mapped the data back into our sales platform, equipping the team with the context needed to close.",
      primaryCategory: "growth",
      modes: ["sales operations", "data management", "pipeline progression"],
      connections: ["conference-workshop-presentation", "conference-outreach"]
    },
    {
      id: "customer-onboarding",
      day: "friday",
      slot: "Afternoon",
      title: "Customer Onboarding Sessions",
      summary: "Guide new customer leaders through adoption priorities.",
      detail: "I helped customer leadership understand the organisational decisions required for successful platform adoption. I adapted these onboarding sessions to their specific operational context and technical capacity.",
      primaryCategory: "delivery",
      modes: ["advisory", "implementation", "customer success"],
      connections: []
    }
  ];

  let currentFilter = 'all';

  function init() {
    renderFilters();
    renderGrid();
  }

  function renderFilters() {
    const container = document.getElementById('filterContainer');
    
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn';
    allBtn.textContent = 'All';
    allBtn.setAttribute('aria-pressed', 'true');
    allBtn.onclick = () => setFilter('all', allBtn);
    container.appendChild(allBtn);

    Object.entries(categories).forEach(([key, cat]) => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = cat.label;
      btn.setAttribute('aria-pressed', 'false');
      btn.onclick = () => setFilter(key, btn);
      container.appendChild(btn);
    });
  }

  function setFilter(filterKey, activeBtn) {
    currentFilter = filterKey;
    document.querySelectorAll('.filter-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
    activeBtn.setAttribute('aria-pressed', 'true');

    const cards = document.querySelectorAll('.card');
    let visibleCount = 0;

    cards.forEach(card => {
      if (filterKey === 'all' || card.dataset.category === filterKey) {
        card.classList.remove('filtered-out');
        card.removeAttribute('aria-hidden');
        card.tabIndex = 0;
        visibleCount++;
      } else {
        card.classList.add('filtered-out');
        card.setAttribute('aria-hidden', 'true');
        card.tabIndex = -1;
      }
    });

    document.getElementById('announceArea').textContent = `Showing ${visibleCount} entries.`;
  }

  function renderGrid() {
    const grid = document.getElementById('calendarGrid');
    
    days.forEach(day => {
      const col = document.createElement('div');
      col.className = 'day-column';
      
      const header = document.createElement('h2');
      header.textContent = day;
      col.appendChild(header);

      const slotsContainer = document.createElement('div');
      slotsContainer.className = 'slots';

      const dayEntries = entryData.filter(e => e.day === day);
      
      dayEntries.forEach(entry => {
        const cat = categories[entry.primaryCategory];
        
        const card = document.createElement('button');
        card.className = 'card';
        card.dataset.category = entry.primaryCategory;
        card.dataset.id = entry.id;
        card.dataset.connections = JSON.stringify(entry.connections || []);
        card.style.borderLeftColor = cat.color;
        
        card.innerHTML = `
          <div class="slot-label">${entry.slot}</div>
          <div class="card-cat-label" style="color: ${cat.color}">${cat.label}</div>
          <h3 class="card-title">${entry.title}</h3>
          <p class="card-summary">${entry.summary}</p>
        `;

        card.onclick = () => openDetail(entry);
        slotsContainer.appendChild(card);
      });

      col.appendChild(slotsContainer);
      grid.appendChild(col);
    });
  }

  function openDetail(entry) {
    const dialog = document.getElementById('detailDialog');
    const content = document.getElementById('dialogContent');
    const cat = categories[entry.primaryCategory];

    content.innerHTML = `
      <div class="card-cat-label" style="color: ${cat.color}; margin-bottom: 1rem;">${cat.label}</div>
      <h2 style="margin-top:0; margin-bottom: 0.5rem; font-size: 1.35rem;">${entry.title}</h2>
      <p style="font-size: 1rem; color: var(--text-main); margin-bottom: 1.5rem;">${entry.detail}</p>
      
      <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem;">Operating Modes</div>
      <div class="detail-tags">
        ${entry.modes.map(m => `<span class="tag">${m}</span>`).join('')}
      </div>
    `;

    document.querySelectorAll('.card').forEach(c => c.classList.remove('is-related'));
    if (entry.connections && entry.connections.length > 0) {
      entry.connections.forEach(connId => {
        const relatedCard = document.querySelector(`.card[data-id="${connId}"]`);
        if (relatedCard) relatedCard.classList.add('is-related');
      });
    }

    dialog.showModal();
  }

  document.getElementById('closeDialogBtn').onclick = () => {
    document.getElementById('detailDialog').close();
    document.querySelectorAll('.card').forEach(c => c.classList.remove('is-related'));
  };

  document.getElementById('detailDialog').addEventListener('click', (e) => {
    const dialogDimensions = e.target.getBoundingClientRect();
    if (
      e.clientX < dialogDimensions.left ||
      e.clientX > dialogDimensions.right ||
      e.clientY < dialogDimensions.top ||
      e.clientY > dialogDimensions.bottom
    ) {
      e.target.close();
      document.querySelectorAll('.card').forEach(c => c.classList.remove('is-related'));
    }
  });

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
